<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attachment Application</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #172b4d;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    header {
      padding: 28px max(24px, calc((100% - 1180px) / 2));
      color: white;
      background: linear-gradient(120deg, #12376a, #176b70);
    }

    header p { margin: 8px 0 0; color: #d7e8f4; }
    h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); }
    h2 { margin: 0 0 18px; font-size: 1.15rem; }
    .header-content { max-width: 1180px; margin: auto; }
    .header-nav { margin-top: 16px; }
    .header-nav a { color: white; font-weight: 650; }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 600px);
      justify-content: center;
      gap: 22px;
      max-width: 1230px;
      margin: 26px auto;
      padding: 0 24px;
    }

    .panel {
      padding: 22px;
      border: 1px solid #e0e7f0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 5px 20px rgb(22 46 79 / 5%);
    }

    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-size: .88rem; font-weight: 600; }

    input, select, button {
      min-height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }

    input, select { width: 100%; padding: 9px 10px; background: white; }
    input:focus, select:focus, button:focus-visible {
      outline: 3px solid #9cc9f2;
      outline-offset: 1px;
    }

    .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      padding: 9px 14px;
      border: 0;
      color: white;
      background: #145d68;
      cursor: pointer;
      font-weight: 650;
    }

    button:hover { background: #104c55; }
    button:disabled { opacity: .6; cursor: wait; }
    .message { min-height: 1.2em; margin: 0; font-size: .9rem; }
    .message.error { color: #a12525; }
    .message.success { color: #17613c; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .toolbar button { min-height: 36px; }
    .summary { color: #50627a; font-size: .9rem; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #e8edf3; vertical-align: top; }
    th { color: #52647a; font-size: .77rem; letter-spacing: .04em; text-transform: uppercase; }
    td { font-size: .9rem; }
    .subtle { display: block; margin-top: 4px; color: #64748b; font-size: .82rem; }
    .status-select { min-width: 118px; min-height: 36px; padding: 5px 8px; }
    .empty { padding: 28px 8px; color: #64748b; text-align: center; }
    footer { max-width: 1230px; margin: 0 auto; padding: 0 24px 24px; color: #64748b; font-size: .82rem; }

    @media (max-width: 850px) {
      main { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      header { padding: 22px 18px; }
      main { margin-top: 18px; padding: 0 14px; }
      .panel { padding: 17px; }
      .date-row { grid-template-columns: 1fr; }
      footer { padding: 0 14px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Attachment Application</h1>
      <p>Submit your details to apply for an attachment placement.</p>
      <nav class="header-nav"><a href="/staff">Staff sign in</a></nav>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">New application</h2>
      <form id="application-form">
        <label>
          Student full name
          <input name="full_name" autocomplete="name" maxlength="120" required>
        </label>
        <label>
          Email address
          <input name="email" type="email" autocomplete="email" maxlength="254" required>
        </label>
        <label>
          Phone number
          <input name="phone" type="tel" autocomplete="tel" maxlength="40" required>
        </label>
        <label>
          Institution
          <input name="institution" maxlength="160" required>
        </label>
        <label>
          Course or area of study
          <input name="course" maxlength="160" required>
        </label>
        <div class="date-row">
          <label>
            Start date
            <input name="start_date" type="date" required>
          </label>
          <label>
            End date
            <input name="end_date" type="date" required>
          </label>
        </div>
        <button id="submit-button" type="submit">Submit application</button>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <footer>
    Student submissions are visible only to signed-in staff. Contact the organization directly to ask about your application.
  </footer>

  <script>
    const form = document.querySelector("#application-form");
    const submitButton = document.querySelector("#submit-button");
    const formMessage = document.querySelector("#form-message");
    function showMessage(element, message, kind = "") {
      element.textContent = message;
      element.className = `message ${kind}`.trim();
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...options.headers }
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || "The request failed.");
      }
      return result;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      showMessage(formMessage, "Submitting...");
      const values = Object.fromEntries(new FormData(form).entries());
      try {
        await request("/api/applications", {
          method: "POST",
          body: JSON.stringify(values)
        });
        form.reset();
        showMessage(formMessage, "Application submitted.", "success");
      } catch (error) {
        showMessage(formMessage, error.message, "error");
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
